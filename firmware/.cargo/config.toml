# ESP32-C6 is the default target:
#   cargo run --release      build, flash and monitor the C6
#   cargo build --release
# ESP32-S3 (secondary, needs the Xtensa toolchain from `espup install`):
#   cargo +esp s3 / cargo +esp build-s3
[build]
target = "riscv32imac-unknown-none-elf"

[alias]
s3 = "run --release --no-default-features --features esp32s3 --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc"
build-s3 = "build --release --no-default-features --features esp32s3 --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc"

[target.riscv32imac-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32c6"
rustflags = ["-C", "force-frame-pointers"]

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --chip esp32s3"
rustflags = ["-C", "link-arg=-nostartfiles"]

[env]
ESP_LOG = "info"
