[package]
name = "els-firmware"
version = "0.1.0"
edition = "2021"
description = "Single-axis electronic gearbox firmware (ESP32-S3 / ESP32-C6, Embassy)."

[[bin]]
name = "els"
path = "src/main.rs"
test = false
bench = false

[dependencies]
els-core = { path = "../els-core" }

esp-hal = { version = "~1.0", features = ["unstable"] }
esp-rtos = { version = "0.2", features = ["embassy", "esp-radio"] }
# WiFi setup portal (only started from the Setup button).
esp-radio = { version = "0.17", features = ["wifi", "unstable"] }
esp-alloc = "0.9"
embassy-net = { version = "0.7", features = ["medium-ethernet", "tcp", "udp", "proto-ipv4"] }
edge-dhcp = "0.5"
edge-nal = "0.5"
edge-nal-embassy = "0.6"
embedded-io-async = "0.6"
# Settings and operator state in the NVS partition's flash.
esp-storage = "0.8"
embedded-storage = "0.3"
esp-bootloader-esp-idf = "0.4"
# Log over USB-Serial-JTAG, leaving the UARTs free (on the S3/H5, UART0's pins drive the Nextion).
esp-println = { version = "0.16", default-features = false, features = ["critical-section", "jtag-serial"] }
esp-backtrace = { version = "0.18", features = ["panic-handler", "println"] }

embassy-executor = "0.9"
embassy-time = "0.5"
embassy-sync = "0.7"
embassy-futures = "0.1"
static_cell = "2.1"
heapless = "0.8"

[features]
# ESP32-C6 is the primary target (stable Rust). ESP32-S3 builds with
# `cargo +esp build-s3` and needs the Xtensa toolchain from espup.
default = ["esp32c6"]
# Bench testing without a display: start the setup hotspot at power-up.
setup-on-boot = []
# Bench debugging without a display: hotspot at power-up, Nextion UART
# traffic logged, and a repeating jog sequence on STEP/DIR for a scope.
bench = ["setup-on-boot", "nextion-log"]
# Hardware-in-the-loop tests (hil/): touch input over USB, display commands
# and STEP pulse counts in the log, defaults instead of saved settings.
hil = ["nextion-log"]
# Test-drive build on a solder breadboard (C6 only): a 74HCT125 buffer in
# the valley under the DevKit drives the servo at 5 V, so STEP/DIR/ENA and
# the encoder move to pins that line up with it. See config.rs. A PCB would
# use the normal pinout.
breadboard = []
# Log every byte to and from the display, and each decoded key.
nextion-log = []
# Log encoder pin levels, software-counted edges, PCNT count and RPM twice a second.
encoder-log = []
esp32s3 = [
    "esp-hal/esp32s3",
    "esp-rtos/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-println/esp32s3",
    "esp-backtrace/esp32s3",
    "esp-radio/esp32s3",
    "esp-storage/esp32s3",
]
esp32c6 = [
    "esp-hal/esp32c6",
    "esp-rtos/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-println/esp32c6",
    "esp-backtrace/esp32c6",
    "esp-radio/esp32c6",
    "esp-storage/esp32c6",
]

[profile.release]
codegen-units = 1
opt-level = 3
lto = "fat"
debug = 2

[profile.dev]
opt-level = "s"
