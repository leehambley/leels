[package]
name = "els-firmware"
version = "0.1.0"
edition = "2021"
description = "Single-axis electronic gearbox firmware (ESP32-S3 / ESP32-C6, Embassy)."

[[bin]]
name = "els"
path = "src/main.rs"
test = false
bench = false

[dependencies]
els-core = { path = "../els-core" }

esp-hal = { version = "~1.0", features = ["unstable"] }
esp-rtos = { version = "0.2", features = ["embassy"] }
esp-bootloader-esp-idf = "0.4"
# Log over USB-Serial-JTAG: UART0's pins (GPIO43/44) drive the Nextion on the H5 board.
esp-println = { version = "0.16", default-features = false, features = ["critical-section", "jtag-serial"] }
esp-backtrace = { version = "0.18", features = ["panic-handler", "println"] }

embassy-executor = "0.9"
embassy-time = "0.5"
embassy-sync = "0.7"
embassy-futures = "0.1"
static_cell = "2.1"
heapless = "0.8"

[features]
esp32s3 = [
    "esp-hal/esp32s3",
    "esp-rtos/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-println/esp32s3",
    "esp-backtrace/esp32s3",
]
esp32c6 = [
    "esp-hal/esp32c6",
    "esp-rtos/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-println/esp32c6",
    "esp-backtrace/esp32c6",
]

[profile.release]
codegen-units = 1
opt-level = 3
lto = "fat"
debug = 2

[profile.dev]
opt-level = "s"
