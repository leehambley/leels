name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core logic tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # test report check run
    defaults:
      run:
        working-directory: els-core
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: els-core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # JUnit report path is set in els-core/.config/nextest.toml.
      - run: cargo nextest run --profile ci
      # Per-test results as a check run, failure annotations, and a table in the
      # job summary. Statuses are written as text (not icons only) so the
      # summary reads well with screen readers and high-contrast themes.
      - uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() }}
        with:
          report_paths: els-core/target/nextest/ci/junit.xml
          check_name: Core logic test report
          require_tests: true
          include_passed: true
          detailed_summary: true
          include_time_in_summary: true
          simplified_summary: false
      # The raw JUnit XML, for downloading or opening in other tools.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: core-test-report-junit
          path: els-core/target/nextest/ci/junit.xml
          if-no-files-found: error

  firmware-esp32c6:
    name: Firmware ESP32-C6
    needs: core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          workspaces: firmware
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release --timings
      - name: Build report
        run: >-
          python3 ../.github/scripts/build_summary.py "Firmware ESP32-C6"
          target/riscv32imac-unknown-none-elf/release/els
          target/cargo-timings/cargo-timing.html
          "${{ steps.cache.outputs.cache-hit }}"
      # ELF (flash with `espflash flash <file>`), named with the short commit.
      - name: Name firmware file
        run: |
          short=${GITHUB_SHA::7}
          echo "SHORT_SHA=$short" >> "$GITHUB_ENV"
          cp target/riscv32imac-unknown-none-elf/release/els "els-esp32c6-$short.elf"
      - uses: actions/upload-artifact@v7
        with:
          name: els-esp32c6-${{ env.SHORT_SHA }}
          path: firmware/els-esp32c6-${{ env.SHORT_SHA }}.elf
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: build-timings-esp32c6
          path: firmware/target/cargo-timings/cargo-timing.html

  firmware-esp32s3:
    name: Firmware ESP32-S3
    needs: core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        env:
          # espup queries the GitHub API; anonymous requests get rate-limited.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          buildtargets: esp32s3
          ldproxy: false
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          workspaces: firmware
      - run: cargo +esp build-s3 --timings
      - name: Build report
        run: >-
          python3 ../.github/scripts/build_summary.py "Firmware ESP32-S3"
          target/xtensa-esp32s3-none-elf/release/els
          target/cargo-timings/cargo-timing.html
          "${{ steps.cache.outputs.cache-hit }}"
      # ELF (flash with `espflash flash <file>`), named with the short commit.
      - name: Name firmware file
        run: |
          short=${GITHUB_SHA::7}
          echo "SHORT_SHA=$short" >> "$GITHUB_ENV"
          cp target/xtensa-esp32s3-none-elf/release/els "els-esp32s3-$short.elf"
      - uses: actions/upload-artifact@v7
        with:
          name: els-esp32s3-${{ env.SHORT_SHA }}
          path: firmware/els-esp32s3-${{ env.SHORT_SHA }}.elf
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: build-timings-esp32s3
          path: firmware/target/cargo-timings/cargo-timing.html
