name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core logic tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: els-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: els-core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  firmware-esp32c6:
    name: Firmware ESP32-C6
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: els-esp32c6
          path: firmware/target/riscv32imac-unknown-none-elf/release/els

  firmware-esp32s3:
    name: Firmware ESP32-S3
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.6
        with:
          buildtargets: esp32s3
          ldproxy: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      - run: cargo +esp build-s3
      - uses: actions/upload-artifact@v4
        with:
          name: els-esp32s3
          path: firmware/target/xtensa-esp32s3-none-elf/release/els
